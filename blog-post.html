<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Blog – DatamatrixAI</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/blogs.css">
    <link rel="stylesheet" href="css/nav-dropdown.css">
    <style>
        header {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            z-index: 9999 !important;
            background: rgba(0,10,30,0.95) !important;
        }
        #read-progress {
    position: fixed;
    top: 0;
    left: 0;
    width: 0%;
    height: 3px;
    background: linear-gradient(to right, #0057B8, #FF8C00);
    z-index: 99999;
    transition: width 0.1s linear;
}

/* Author avatar */
.post-author-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
}

.post-author-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    border: 2px solid rgba(0, 87, 184, 0.4);
    background: rgba(0, 20, 55, 0.5);
}

.post-author-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
}

.post-author-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.post-author-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    color: #ffffff;
}

.post-author-role {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.4);
}
    </style>
</head>
<body>
    <div id="read-progress"></div>
    <!-- TWO-COLUMN LAYOUT: sidebar + post content -->
    <div class="post-layout" id="postLayout">

        <!-- LEFT SIDEBAR — all posts list -->
        <aside class="post-sidebar" id="postSidebar">
            <div class="sidebar-header">
                <a href="blogs.html" class="sidebar-back">
                    <i class="fas fa-arrow-left"></i> All Posts
                </a>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Populated by JS -->
            </nav>
        </aside>

        <!-- MAIN POST CONTENT -->
        <main class="post-main" id="postMain">
            <!-- Filled by JS based on ?id= in URL -->
        </main>

    </div>

    <script>
        /* ================================================
           BLOG POST DATA
           ================================================
           To add a new post:
           1. Add a new object to the `posts` array below
           2. Give it the next sequential id
           3. Add a matching entry in blogs.html allPosts array
        ================================================ */

        const posts = [
         {
        id: 1,
        category: "Strategy",
        date: "Jun 5, 2026",
        readTime: "6 min",
        author: "George Johnson",
        authorRole: "Co-Founder, DatamatrixAI",
        authorPhoto: "assets/images/george.jpg",
        title: "Why Most Enterprise AI Projects Fail Before They Start",
        tags: ["AI Strategy", "Enterprise", "Adoption"],
        body: `...keep your existing body content...`
    },
    {
        id: 2,
        category: "Engineering",
        date: "May 28, 2026",
        readTime: "8 min",
        author: "Radhabaran Mohanty",
        authorRole: "Co-Founder, DatamatrixAI",
        authorPhoto: "assets/images/radha.jpg",
        title: "Semantic Layers: The Missing Piece in Enterprise Data Architecture",
        tags: ["Engineering", "Data Architecture", "Semantic AI"],
        body: `...keep your existing body content...`
    }
        ];

        /* ================================================
           RENDER ENGINE
        ================================================ */
        function getPostId() {
            const params = new URLSearchParams(window.location.search);
            return parseInt(params.get('id'));
        }

        function renderSidebar(activeId) {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = posts.map(p => `
                <a href="blog-post.html?id=${p.id}"
                   class="sidebar-item ${p.id === activeId ? 'active' : ''}">
                    <span class="sidebar-item-title">${p.title}</span>
                    <span class="sidebar-item-date">${p.date}</span>
                </a>
            `).join('');
        }

        function renderPost(post) {
    document.getElementById('pageTitle').textContent = post.title + ' – DatamatrixAI';
    renderSidebar(post.id);
    document.getElementById('postMain').innerHTML = `
        <article class="post-article">

            <div class="post-header">
                <div class="post-header-meta">
                    <span class="blog-category-badge ${post.category.toLowerCase()}">${post.category}</span>
                    <span class="post-meta-item"><i class="fas fa-calendar-alt"></i> ${post.date}</span>
                    <span class="post-meta-item"><i class="fas fa-clock"></i> ${post.readTime}</span>
                </div>
                <h1 class="post-title">${post.title}</h1>

                <!-- AUTHOR ROW WITH AVATAR -->
                <div class="post-author-row">
                    <div class="post-author-avatar">
                        <img src="${post.authorPhoto}" alt="${post.author}">
                    </div>
                    <div class="post-author-info">
                        <span class="post-author-name">${post.author}</span>
                        <span class="post-author-role">${post.authorRole}</span>
                    </div>
                </div>

                <div class="blog-tags" style="margin-top: 1rem;">
                    ${post.tags.map(t => `<span class="blog-tag">${t}</span>`).join('')}
                </div>
            </div>

            <div class="post-body">
                ${post.body}
            </div>

            <div class="post-footer-nav">
                <a href="blogs.html" class="post-back-link">
                    <i class="fas fa-arrow-left"></i> Back to all posts
                </a>
            </div>
        </article>
    `;

    // start progress bar after post renders
    initProgressBar();
}

        function renderNotFound() {
            renderSidebar(-1);
            document.getElementById('postMain').innerHTML = `
                <div class="post-not-found">
                    <i class="fas fa-file-circle-question"></i>
                    <h2>Post not found</h2>
                    <p>This post may have moved or been removed.</p>
                    <a href="blogs.html" class="blog-read-btn" style="display:inline-flex; margin-top: 1.5rem;">
                        <i class="fas fa-arrow-left"></i> Back to all posts
                    </a>
                </div>
            `;
        }

        const id = getPostId();
        const post = posts.find(p => p.id === id);
        post ? renderPost(post) : renderNotFound();

        function initProgressBar() {
    const bar = document.getElementById('read-progress');
    const article = document.querySelector('.post-article');
    if (!bar || !article) return;

    window.addEventListener('scroll', () => {
        const articleTop = article.offsetTop;
        const articleHeight = article.offsetHeight;
        const scrolled = window.scrollY - articleTop;
        const percent = Math.min(100, Math.max(0, (scrolled / articleHeight) * 100));
        bar.style.width = percent + '%';
    });
}
    </script>
<script src="js/nav-inject.js"></script>
    <script src="js/nav.js"></script>   
</body>
</html>
